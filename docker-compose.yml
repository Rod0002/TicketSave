version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ticketsave-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: ticketsave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend # Aponta para a pasta do Spring Boot
    container_name: ticketsave-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # Força o Spring Boot a conectar no banco do Docker e não no localhost da sua máquina
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ticketsave
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  frontend:
    build: 
      context: ./frontend # Aponta para a pasta do React
    container_name: ticketsave-frontend
    ports:
      - "80:80" # Vai rodar na porta 80, a padrão da internet
    depends_on:
      - backend

volumes:
  postgres_data: